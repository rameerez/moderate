# RuboCop for the moderate gem. CI runs `bundle exec rubocop` (the `rubocop` job in
# .github/workflows/test.yml) and expects zero offenses.
AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "gemfiles/**/*"          # generated by `bundle exec appraisal generate`
    - "test/dummy/db/schema.rb" # never committed; a local db task may dump one
    - "test/dummy/tmp/**/*"     # generator test output
    - "tmp/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# --- The shape of this codebase ---------------------------------------------
#
# The gem explains itself in prose next to the code (the legal reasoning behind a
# decision path, the Active Record timing a callback depends on), and its decision
# services are deliberately one readable method per step of a decision. Size
# metrics count those methods, not their difficulty, so they are off; the
# complexity metrics stay on, capped at what the code is today.
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 13
# Keyword arguments name themselves (Flag.flag! takes the nine columns it files).
Metrics/ParameterLists:
  CountKeywordArgs: false

Layout/LineLength:
  Max: 140
  Exclude:
    - "moderate.gemspec" # the description is one long, deliberate paragraph

# `has_reporting_and_blocking` / `has_reportable_content` are the ecosystem's macro
# names (has_credits, has_wallets, has_api_keys), not predicates.
Naming/PredicatePrefix:
  AllowedMethods:
    - has_reporting_and_blocking
    - has_reportable_content

Naming/RescuedExceptionsVariableName:
  PreferredName: error

# Rails' own idiom in tests: `class ActiveSupport::TestCase`, `class Moderate::XTest`.
Style/ClassAndModuleChildren:
  Exclude:
    - "test/**/*"

# Bang methods and `save` answer true/false by Active Record convention; the test
# recorder's `audit` / `notify` return "delivered" the way a host's hooks do.
Naming/PredicateMethod:
  AllowBangMethods: true
  AllowedMethods:
    - call
    - save
    - audit
    - notify

# The house style: continuation lines are indented one step, not aligned to the
# first argument or the receiver.
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

# `adapter = case ref … end`: `when` and `end` line up with the assignment.
Layout/CaseIndentation:
  EnforcedStyle: end
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

# Configuration groups its accessors by section (filtering, hooks, the legal
# forms), each with its own comment; one grouped list would lose that.
Style/AccessorGrouping:
  Enabled: false

# ActiveSupport::Concern's `class_methods do … end` opens its own scope, so a
# `private` inside it says nothing about the module's instance methods.
Lint/UselessAccessModifier:
  ContextCreatingMethods:
    - class_methods
    - included

# Strings continued with `\` are laid out to read well where they are (aligned
# under a `raise`, or indented under a keyword); the code uses both.
Layout/LineEndStringConcatenationIndentation:
  Enabled: false
